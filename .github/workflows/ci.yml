name: CI

# Runs on every PR into the protected integration branch, and on pushes to it.
# Two independent checks are published so you can require them separately in the
# branch ruleset:
#   - "Type check (tsc)"   — green today; safe to mark as a required status check.
#   - "Unit tests (vitest)" — currently has pre-existing failures; mark it required
#                             once the suite is green.
on:
  pull_request:
    branches: ["full-build/admin-misc"]
  push:
    branches: ["full-build/admin-misc"]

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run
