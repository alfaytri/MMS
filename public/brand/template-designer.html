@font-face{font-family:'Teko';src:url('Font/IBM_Plex_Sans,IBM_Plex_Sans_Arabic,Rajdhani,Tajawal,Teko/Teko/static/Teko-Medium.ttf') format('truetype');font-weight:500;}
@font-face{font-family:'Teko';src:url('Font/IBM_Plex_Sans,IBM_Plex_Sans_Arabic,Rajdhani,Tajawal,Teko/Teko/static/Teko-SemiBold.ttf') format('truetype');font-weight:600;}
@font-face{font-family:'Teko';src:url('Font/IBM_Plex_Sans,IBM_Plex_Sans_Arabic,Rajdhani,Tajawal,Teko/Teko/static/Teko-Bold.ttf') format('truetype');font-weight:700;}

/* ── Designer UI ────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#f1f5f9;font-family:'PlexEN',system-ui,sans-serif;color:#0f172a;}
.toolbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.toolbar label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#64748b;display:flex;flex-direction:column;gap:4px;}
.toolbar select,.toolbar input[type=color]{height:36px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;font-size:13px;font-family:inherit;cursor:pointer;}
.toolbar input[type=color]{width:44px;padding:2px;cursor:pointer;}
.toolbar .fmt-group{display:flex;gap:0;}
.toolbar .fmt-btn{padding:6px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-family:inherit;transition:.15s;}
.toolbar .fmt-btn:first-child{border-radius:6px 0 0 6px;}
.toolbar .fmt-btn:last-child{border-radius:0 6px 6px 0;}
.toolbar .fmt-btn:not(:first-child){border-left:0;}
.toolbar .fmt-btn.active{background:#0f172a;color:#fff;border-color:#0f172a;}
.toolbar .dl-btn{margin-left:auto;padding:8px 20px;background:#ED7C2C;color:#fff;border:0;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.toolbar .dl-btn:hover{background:#d96a1e;}
.preview-area{display:flex;justify-content:center;padding:32px 24px 60px;}

/* ── A4 page ────────────────────────────────────────────────────── */
.page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ── Format A: Ribbon ───────────────────────────────────────────── */
.fmt-a .pg-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:14mm 14mm 0;}
.fmt-a .pg-logo{width:120px;height:auto;align-self:center;margin:0 6mm;}
.fmt-a .pg-en{text-align:left;}
.fmt-a .pg-ar{text-align:right;direction:rtl;}
.fmt-a .pg-brand{font-weight:700;margin-bottom:4px;line-height:1.1;}
.fmt-a .pg-tagline{font-weight:400;margin-bottom:6px;line-height:1.3;}
.fmt-a .pg-addr{line-height:1.6;}
.fmt-a .midbar{position:relative;margin-top:4mm;}
.fmt-a .contact-strip{display:flex;justify-content:space-between;padding:5mm 14mm;}
.fmt-a .contact-strip a{text-decoration:none;font-size:10px;}
.fmt-a .dark-strip{height:9mm;}
.fmt-a .ribbon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;padding:3.5mm 8mm 3mm;text-align:center;line-height:1.2;width:58mm;}
.fmt-a .ribbon .ar-title{font-weight:700;margin-bottom:.8mm;}
.fmt-a .ribbon .en-title{font-weight:600;letter-spacing:.4px;}
.fmt-a .ribbon .doc-no{font-size:9px;margin-top:1mm;opacity:.9;}
.fmt-a .meta{display:grid;grid-template-columns:1fr 1fr;gap:0 18mm;padding:6mm 14mm 4mm;}
.fmt-a .meta-block{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.7px solid #d0d0d0;padding:3mm 0;}
.fmt-a .meta-label{text-align:right;}
.fmt-a .meta-label .en{color:#6b7280;margin-top:1px;}
.fmt-a .tbl-wrap{padding:4mm 14mm 0;}
.fmt-a table.doc-table{width:100%;border-collapse:collapse;direction:rtl;border:.7px solid #111;}
.fmt-a table.doc-table th{color:#fff;padding:3.5mm 3mm;text-align:center;vertical-align:middle;font-weight:700;border-right:.7px solid #111;}
.fmt-a table.doc-table th:first-child{border-right:0;}
.fmt-a table.doc-table th .en{display:block;font-weight:400;margin-top:1px;opacity:.9;}
.fmt-a table.doc-table td{border-top:.7px solid #111;padding:3.5mm 3mm;vertical-align:middle;}
.fmt-a table.doc-table td.cn{text-align:center;}
.fmt-a table.doc-table td.ri{text-align:right;}
.fmt-a .totals-wrap{padding:0 14mm;}
.fmt-a table.totals{width:100%;border-collapse:collapse;direction:rtl;border:.7px solid #111;border-top:0;}
.fmt-a table.totals th{color:#fff;padding:3mm 3mm;text-align:center;font-weight:700;border-right:.7px solid #111;}
.fmt-a table.totals th:first-child{border-right:0;}
.fmt-a table.totals th .en{display:block;font-weight:400;margin-top:1px;opacity:.9;}
.fmt-a table.totals td{padding:3.5mm 3mm;text-align:center;background:#efefef;font-weight:700;border-right:.7px solid #111;border-top:.7px solid #111;}
.fmt-a table.totals td:first-child{border-right:0;}
.fmt-a .terms{padding:5mm 14mm 0;}
.fmt-a .terms-row{display:grid;grid-template-columns:48mm 1fr;gap:4mm;margin-bottom:1.5mm;}
.fmt-a .terms-key{font-weight:600;}
.fmt-a .terms-val{color:#6b7280;}
.fmt-a .pg-footer{padding:5mm 14mm 10mm;text-align:center;}
.fmt-a .pg-footer img{height:50px;}

/* ── Format B: Clean Band ───────────────────────────────────────── */
.fmt-b .pg-header{display:flex;align-items:center;padding:10mm 14mm 8mm;gap:6mm;}
.fmt-b .pg-logo{height:60px;width:auto;}
.fmt-b .pg-co-info{flex:1;}
.fmt-b .pg-brand{font-weight:700;line-height:1.1;}
.fmt-b .pg-tagline{font-weight:300;margin-top:2px;}
.fmt-b .pg-addr{margin-top:4px;color:#6b7280;line-height:1.5;}
.fmt-b .pg-ar-side{text-align:right;direction:rtl;flex:1;}
.fmt-b .doc-band{padding:4mm 14mm;color:#fff;display:flex;justify-content:space-between;align-items:center;}
.fmt-b .doc-band .doc-title{font-weight:700;}
.fmt-b .doc-band .doc-title-ar{font-weight:700;direction:rtl;}
.fmt-b .doc-band .doc-num{font-weight:400;opacity:.9;}
.fmt-b .meta{display:grid;grid-template-columns:1fr 1fr;gap:0 14mm;padding:6mm 14mm 4mm;}
.fmt-b .meta-block{display:flex;justify-content:space-between;align-items:center;border-bottom:.7px solid #e2e8f0;padding:3mm 0;}
.fmt-b .meta-label{text-align:right;color:#6b7280;}
.fmt-b .tbl-wrap{padding:4mm 14mm 0;}
.fmt-b table.doc-table{width:100%;border-collapse:collapse;direction:rtl;}
.fmt-b table.doc-table th{border-bottom:2px solid #111;padding:3mm 3mm;text-align:center;font-weight:600;color:#111;}
.fmt-b table.doc-table th .en{display:none;}
.fmt-b table.doc-table td{border-bottom:.7px solid #e2e8f0;padding:3.5mm 3mm;vertical-align:middle;}
.fmt-b table.doc-table td.cn{text-align:center;}
.fmt-b table.doc-table td.ri{text-align:right;}
.fmt-b .totals-wrap{padding:4mm 14mm 0;display:flex;justify-content:flex-start;direction:rtl;}
.fmt-b .totals-block{display:grid;grid-template-columns:auto auto;gap:2mm 12mm;font-weight:600;}
.fmt-b .totals-block .tot-label{text-align:right;color:#6b7280;font-weight:400;}
.fmt-b .totals-block .tot-val{text-align:right;}
.fmt-b .totals-block .tot-grand{font-weight:700;padding-top:2mm;border-top:2px solid #111;}
.fmt-b .terms{padding:5mm 14mm 0;}
.fmt-b .terms-row{display:grid;grid-template-columns:48mm 1fr;gap:4mm;margin-bottom:1.5mm;}
.fmt-b .terms-key{font-weight:600;}
.fmt-b .terms-val{color:#6b7280;}
.fmt-b .pg-footer{padding:6mm 14mm 10mm;display:flex;justify-content:space-between;align-items:center;border-top:.7px solid #e2e8f0;margin-top:6mm;}
.fmt-b .pg-footer .motto{font-weight:300;color:#6b7280;}
.fmt-b .pg-footer img{height:40px;}

/* ── Format C: Side-Panel ───────────────────────────────────────── */
.fmt-c{display:grid;grid-template-columns:52mm 1fr;min-height:297mm;}
.fmt-c .side-panel{color:#fff;padding:12mm 6mm;display:flex;flex-direction:column;align-items:center;gap:6mm;}
.fmt-c .side-panel .pg-logo{width:80px;height:auto;filter:brightness(0) invert(1);}
.fmt-c .side-panel .doc-type{text-align:center;margin-top:4mm;}
.fmt-c .side-panel .doc-type .ar-title{font-weight:700;margin-bottom:2mm;}
.fmt-c .side-panel .doc-type .en-title{font-weight:600;letter-spacing:.5px;opacity:.9;}
.fmt-c .side-panel .doc-type .doc-no{font-weight:300;margin-top:3mm;opacity:.8;}
.fmt-c .side-panel .side-contact{margin-top:auto;text-align:center;font-weight:300;opacity:.8;line-height:1.8;}
.fmt-c .side-panel .side-contact a{color:#fff;text-decoration:none;}
.fmt-c .main-body{padding:12mm 12mm 10mm 8mm;}
.fmt-c .pg-co-line{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6mm;padding-bottom:4mm;border-bottom:.7px solid #d0d0d0;}
.fmt-c .pg-co-line .pg-brand{font-weight:700;}
.fmt-c .pg-co-line .pg-addr{color:#6b7280;margin-top:2px;line-height:1.5;}
.fmt-c .pg-co-line .ar-side{text-align:right;direction:rtl;}
.fmt-c .meta{display:grid;grid-template-columns:1fr 1fr;gap:0 12mm;margin-bottom:4mm;}
.fmt-c .meta-block{display:flex;justify-content:space-between;border-bottom:.7px solid #e2e8f0;padding:2.5mm 0;}
.fmt-c .meta-label{color:#6b7280;text-align:right;}
.fmt-c .tbl-wrap{margin-top:2mm;}
.fmt-c table.doc-table{width:100%;border-collapse:collapse;direction:rtl;}
.fmt-c table.doc-table th{padding:3mm;text-align:center;font-weight:600;color:#fff;border-right:.7px solid rgba(255,255,255,.3);}
.fmt-c table.doc-table th:first-child{border-right:0;}
.fmt-c table.doc-table th .en{display:block;font-weight:400;opacity:.85;}
.fmt-c table.doc-table td{border-top:.7px solid #e2e8f0;padding:3mm;vertical-align:middle;}
.fmt-c table.doc-table td.cn{text-align:center;}
.fmt-c table.doc-table td.ri{text-align:right;}
.fmt-c .totals-wrap{margin-top:3mm;display:flex;justify-content:flex-start;direction:rtl;}
.fmt-c .totals-block{display:grid;grid-template-columns:auto auto;gap:2mm 10mm;font-weight:600;}
.fmt-c .totals-block .tot-label{text-align:right;color:#6b7280;font-weight:400;}
.fmt-c .totals-block .tot-grand{font-weight:700;padding-top:2mm;border-top:2px solid #111;}
.fmt-c .terms{margin-top:5mm;}
.fmt-c .terms-row{display:grid;grid-template-columns:44mm 1fr;gap:3mm;margin-bottom:1.5mm;}
.fmt-c .terms-key{font-weight:600;}
.fmt-c .terms-val{color:#6b7280;}
.fmt-c .pg-footer{margin-top:auto;padding-top:5mm;text-align:center;}
.fmt-c .pg-footer img{height:40px;}

/* ── Print ──────────────────────────────────────────────────────── */
@media print{
  .toolbar{display:none!important;}
  .preview-area{padding:0!important;}
  body{background:#fff;}
  .page{box-shadow:none;width:210mm;min-height:297mm;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>

<div class="toolbar">
  <label>Document
    <select id="docType">
      <option value="po">Purchase Order</option>
      <option value="rfq">RFQ</option>
      <option value="bill">Supplier Bill</option>
      <option value="invoice">Sales Invoice</option>
      <option value="quotation">SO Quotation</option>
      <option value="credit">Credit Note</option>
      <option value="debit">Debit Note</option>
      <option value="service">Service Quotation</option>
    </select>
  </label>
  <label>Font Pairing
    <select id="fontPair">
      <option value="plex">IBM Plex Sans + Plex Arabic</option>
      <option value="rajdhani">Rajdhani + Tajawal</option>
      <option value="teko">Teko + Tajawal</option>
      <option value="infield">Infield + Noor (original)</option>
      <option value="myriad">Myriad Arabic (Classic)</option>
    </select>
  </label>
  <label>Format
    <div class="fmt-group">
      <button class="fmt-btn active" data-fmt="a">A — Ribbon</button>
      <button class="fmt-btn" data-fmt="b">B — Clean Band</button>
      <button class="fmt-btn" data-fmt="c">C — Side Panel</button>
    </div>
  </label>
  <label>Brand Color
    <input type="color" id="brandColor" value="#ED7C2C">
  </label>
  <button class="dl-btn" onclick="window.print()">Download PDF</button>
</div>

<div class="preview-area">
  <div class="page" id="pageRoot"></div>
</div>

  },
};

    meta: [
      { val: '28 Jun 2026', ar: 'تاريخ الطلب', en: 'Order Date' },
      { val: '12 Jul 2026', ar: 'تاريخ التسليم المتوقع', en: 'Expected Delivery' },
      { val: '+974 5512 3456', ar: 'هاتف المورد', en: 'Supplier Phone' },

    ],
    cols: [

/* ── Render helpers ──────────────────────────────────────────── */
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderCell(val, isLast) {
  const parts = val.split('|');
  if (isLast) {
    let h = `<div style="line-height:1.4">${esc(parts[0])}</div>`;
    if (parts[1]) h += `<div style="opacity:.6;margin-top:1px">${esc(parts[1])}</div>`;
    return `<td class="ri">${h}</td>`;
  }
  return `<td class="cn">${esc(val)}</td>`;
}

function render() {
  const doc = DOCS[state.doc];
  const font = FONTS[state.font];
  const renderers = { a: renderA, b: renderB, c: renderC };
  document.getElementById('pageRoot').innerHTML = renderers[state.fmt](doc, state.color, font);
}

document.querySelectorAll('.fmt-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.fmt = btn.dataset.fmt;
    render();
  };
});

render();
</script>
</body>
</html>
